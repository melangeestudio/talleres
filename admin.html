<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Mélange Estudio</title>
  <meta name="theme-color" content="#2A59D1">
  <link rel="icon" href="img/marca/tacita.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

  <!-- Login -->
  <main id="vista-login" class="login-wrap" hidden>
    <form id="form-login" class="login-card" novalidate>
      <img class="login-tacita" src="img/marca/tacita.svg" alt="" width="64" height="45">
      <h1>Mélange <span>estudio</span></h1>
      <p class="login-mano">panel de administración</p>
      <label>Contraseña
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" id="btn-login" class="btn">Entrar</button>
    </form>
  </main>

  <!-- Panel -->
  <div id="vista-panel" hidden>
    <header class="admin-top">
      <span class="marca">
        <img class="marca-tacita" src="img/marca/tacita-luz.svg" alt="" width="46" height="32">
        <span class="marca-nombre">Mélange</span>
        <span class="marca-estudio">panel</span>
      </span>
      <div class="admin-top-acc">
        <button type="button" class="btn-link" id="btn-reload" title="Volver a cargar los datos">↻ Actualizar</button>
        <button type="button" class="btn-link" id="btn-salir">Cerrar sesión</button>
      </div>
    </header>

    <main class="wrap">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab activo" data-tab="actividades" role="tab">Actividades</button>
        <button type="button" class="tab" data-tab="inscritos" role="tab">Inscritos</button>
      </nav>

      <div id="estado" class="estado" role="status" hidden></div>

      <!-- Actividades -->
      <section id="tab-actividades">
        <div class="barra">
          <button type="button" class="btn" id="btn-nueva">+ Nueva actividad</button>
          <label class="check"><input type="checkbox" id="chk-pasadas"> Mostrar pasadas</label>
        </div>
        <div class="tabla-wrap">
          <table class="tabla" id="tabla-actividades">
            <thead>
              <tr><th>Fecha</th><th>Taller</th><th>Cupos</th><th>Precio</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Inscritos -->
      <section id="tab-inscritos" hidden>
        <div class="barra">
          <label class="select-label">Actividad
            <select id="sel-actividad"></select>
          </label>
          <button type="button" class="btn" id="btn-agregar-insc">+ Agregar inscrito</button>
        </div>
        <p id="resumen-inscritos" class="resumen"></p>
        <div class="tabla-wrap">
          <table class="tabla" id="tabla-inscritos">
            <thead>
              <tr><th>Nombre</th><th>Personas</th><th>Total</th><th>Teléfono</th><th>Correo</th><th>Inscrito</th><th>Pago</th><th>Comprobante</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal crear / editar actividad -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <button type="button" class="modal-cerrar" id="btn-cerrar" aria-label="Cerrar">&times;</button>
      <h3 id="modal-titulo">Nueva actividad</h3>

      <form id="form-act" novalidate>
        <label>Tipo de taller
          <select name="tipo" id="f-tipo" required></select>
        </label>
        <div class="fila-2">
          <label>Fecha
            <input type="date" name="fecha" id="f-fecha" required>
          </label>
          <label>Hora
            <input type="time" name="hora" id="f-hora" required>
          </label>
        </div>
        <div class="fila-2">
          <label>Cupos totales
            <input type="number" name="cupos" id="f-cupos" min="1" step="1" required>
          </label>
          <label>Precio por persona
            <input type="number" name="precio" id="f-precio" min="0" step="0.01" required>
          </label>
        </div>
        <label>Descripción
          <textarea name="descripcion" id="f-desc" rows="3" maxlength="400"></textarea>
        </label>
        <p class="hint" id="f-nombre-interno"></p>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" id="btn-guardar" class="btn">Guardar</button>
      </form>
    </div>
  </div>

  <!-- Modal eliminar inscripción (total o parcial) -->
  <div id="modal-elim" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="elim-titulo">
      <button type="button" class="modal-cerrar" id="btn-elim-cerrar" aria-label="Cerrar">&times;</button>
      <h3 id="elim-titulo">Eliminar inscripción</h3>
      <p id="elim-detalle" class="resumen"></p>
      <form id="form-elim" novalidate>
        <label id="elim-cantidad-wrap">¿Cuántas personas eliminar?
          <input type="number" id="elim-cantidad" min="1" step="1" inputmode="numeric" required>
        </label>
        <p class="hint" id="elim-hint"></p>
        <p id="elim-error" class="error" role="alert" hidden></p>
        <div class="botones-fila">
          <button type="button" class="btn-sec" id="btn-elim-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-peligro" id="btn-elim-ok">Eliminar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal agregar inscrito manualmente -->
  <div id="modal-manual" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="manual-titulo">
      <button type="button" class="modal-cerrar" id="btn-manual-cerrar" aria-label="Cerrar">&times;</button>
      <h3 id="manual-titulo">Agregar inscrito</h3>
      <p id="manual-detalle" class="resumen"></p>
      <form id="form-manual" novalidate>
        <label>Nombre
          <input type="text" id="m-nombre" maxlength="100" autocomplete="off" required>
        </label>
        <div class="fila-2">
          <label>Teléfono <span class="hint">(opcional)</span>
            <input type="tel" id="m-telefono" maxlength="30" autocomplete="off" inputmode="tel">
          </label>
          <label>Correo <span class="hint">(opcional)</span>
            <input type="email" id="m-email" maxlength="120" autocomplete="off">
          </label>
        </div>
        <div id="m-extra">
          <label>Número de personas
            <input type="number" id="m-personas" min="1" step="1" value="1" inputmode="numeric" required>
          </label>
          <label>¿Ya pagó?
            <select id="m-pagado">
              <option value="no">No, pendiente</option>
              <option value="si">Sí, ya pagó</option>
            </select>
          </label>
          <label class="check check-correo">
            <input type="checkbox" id="m-enviar" disabled>
            <span>Enviarle correo de confirmación <span class="hint" id="m-enviar-hint">(escribe su correo arriba)</span></span>
          </label>
        </div>
        <p class="hint" id="manual-hint"></p>
        <p id="manual-error" class="error" role="alert" hidden></p>
        <button type="submit" id="btn-manual-ok" class="btn">Agregar</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
